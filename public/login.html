<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Blackhole.Net</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%B0%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <style>
    body { overflow: auto; display: grid; place-items: center; min-height: 100vh; }
    .login-wrap { width: min(390px, 92vw); }
    .login-brand { display: flex; align-items: center; gap: 13px; justify-content: center; margin-bottom: 26px; }
    .login-brand .logo-mark { font-size: 34px; }
    .login-brand b { font-size: 19px; letter-spacing: 3px; display: block; line-height: 1.1; }
    .login-brand span { font-size: 10px; letter-spacing: 5px; color: var(--cyan); }
    .login-card { background: var(--panel); border: 1px solid var(--stroke); border-radius: var(--radius);
      padding: 28px; backdrop-filter: blur(14px); box-shadow: var(--shadow-lg); }
    .login-card h1 { font-size: 17px; margin: 0 0 4px; }
    .login-card .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 20px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
      color: var(--muted); margin-bottom: 6px; }
    .field input { width: 100%; }
    .login-err { color: var(--red); font-size: 12.5px; min-height: 18px; margin-bottom: 10px; }
    .roles { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--stroke);
      font-size: 11px; color: var(--dim); line-height: 1.7; }
    .roles b { color: var(--muted); }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="login-wrap">
    <div class="login-brand">
      <div class="logo-mark">◈</div>
      <div><b>BLACKHOLE</b><span>.NET</span></div>
    </div>
    <form class="login-card" id="loginForm" autocomplete="on">
      <h1>Sign in</h1>
      <div class="sub">Network control centre</div>
      <div class="field">
        <label for="u">Username</label>
        <input id="u" name="username" type="text" autocomplete="username" autofocus required />
      </div>
      <div class="field">
        <label for="p">Password</label>
        <input id="p" name="password" type="password" autocomplete="current-password" required />
      </div>
      <div class="login-err" id="err" role="alert"></div>
      <button class="btn btn-primary full" id="go" type="submit">Sign in</button>
      <div class="roles">
        <b>reader</b> — view everything, change nothing<br>
        <b>contributor</b> — blocking, domains, lists, clients, DHCP<br>
        <b>admin</b> — plus DNS config, router control and user management
      </div>
    </form>
    <div class="credit login-credit">
      <span class="credit-line">Powered by <b>J2DK Technologies</b></span>
      <span class="credit-copy">&copy; 2026 J2DK Technologies. All rights reserved.</span>
    </div>
  </div>
  <script>
    // honour the saved theme so the login page matches the app
    (function () {
      var t = localStorage.getItem('phc-theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();

    var form = document.getElementById('loginForm');
    var err = document.getElementById('err');
    var go = document.getElementById('go');
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      err.textContent = '';
      go.disabled = true; go.textContent = 'Signing in…';
      try {
        var res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('u').value,
            password: document.getElementById('p').value,
          }),
        });
        var d = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(d.message || 'Sign-in failed');
        location.href = '/';
      } catch (ex) {
        err.textContent = ex.message;
        go.disabled = false; go.textContent = 'Sign in';
        document.getElementById('p').value = '';
        document.getElementById('p').focus();
      }
    });
  </script>
</body>
</html>
